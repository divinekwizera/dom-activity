
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Board</h1>
        <p>Manage students and track their performance</p>
    </header>

    <main>
        <!-- Statistics -->
        <section class="stats">
            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="count">0</p>
            </div>

            <div class="stat-card">
                <h3>Average Score</h3>
                <p id="average">0</p>
            </div>

            <div class="stat-card">
                <h3>Top Students</h3>
                <p id="top-students">None</p>
            </div>
        </section>

        <!-- Student cards -->
        <h2>All Students</h2>
        <div id="student-list" class="student-grid"></div>
    </main>

    <script src="index.js"></script>
</body>
</html>
